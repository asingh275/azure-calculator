name: Deploy to Azure App Service

# Trigger manually or on push to main
on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: testlearning   # CHANGE THIS to your App Service name
  # AZURE_WEBAPP_SLOT_NAME: staging       # Uncomment + set this to deploy to a specific slot

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18.x'

      - name: Install dependencies
        run: npm install

      # Optional: run tests here if you add any

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          # slot-name: ${{ env.AZURE_WEBAPP_SLOT_NAME }}   # uncomment to target a slot
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
